<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All lists</title>
</head>
<body>
    <h1>All list example</h1>
    <!-- ordered list -->
     <ol type="A">
        <li>Apple</li>
        <li>Balls</li>
        <li>Cat</li>
        <li>Dog</li>
     </ol>
     <!-- unordered list -->
      <ul>
        <li>Apple</li>
        <li>Balls</li>
        <li>Cat</li>
        <li>Dog</li>
      </ul>
      <!-- definition/description list -->
       <dl>

       </dl>
</body>
</html>
