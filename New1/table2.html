<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HtML table example</title>
</head>
<body>
    <h1>example</h1>
    <table border="1" style="border-collapse: collapse;">
        <colgroup>
            <col style="background-color: antiquewhite;">
            <col style="background-color: bisque;">
            <col style="background-color: burlywood;">
            <col style="background-color: azure;">
            
        </colgroup>
        <tr>
            <th>SN</th>
            <th colspan="2">Full Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Ram</td>
            <td>Bhandari</td>
            <td>80.45</td>
        </tr>
        <tr>
            <td>1</td>
            <td>Pradip</td>
            <td>Karki</td>
            <td>65</td>

        </tr>

    </table>


    <table border="1">
        <tbody>
                <tr>
                    <th colspan="3">Student record</th>
                </tr>
            </tbody>
            <tbody>
            <tr>
                <th rowspan="2">Full name</th>
                <td>Ram</td>
                <td>Bhandari</td>
                
            </tr>
            <tr>
                <td>Pradip</td>
                <td>Karki</td>
            </tr>
            <tr>
                <th>Roll number</th>
                <td>20</td>
                <td>22</td>
            </tr>
            <tr>
                <th>marks</th>
                <td>80</td>
                <td>90</td>
            </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="3"> NOte: this a tfoot example</td>
        </tr>
    </tfoot>

    </table>
</body>
</html>
