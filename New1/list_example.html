<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List types</title>
</head>
<body>
    <h1>List types example</h1>
    <!-- ordered list -->
     <h4>Ordered list</h4>
     <ol type="1" start="50">
        <li>Apple</li>
        <li>Banana</li>
        <li>Coconut</li>
        <li>Dog</li>
        <li>Elephant</li>
     </ul>
     <h4>unordered list</h4>
     <ol type="square">
        <li>Apple</li>
        <li>Banana</li>
        <li>Coconut</li>
        <li>Dog</li>
        <li>Elephant</li>
     </ul>

     <!-- defniition list -->
     <h4>defniition list</h4>
     <dl>
        <dt>HTML</dt>
        <dd>Hypettext markup lnguage</dd>
        <dt>CSS</dt>
        <dd>Cascading style sheet</dd>
     </dl>
</body>
</html>
