
<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
</head>
<body>
    <style>
        table {
            border-collapse: collapse;
            
        }

        th, td {
            border-bottom: 1px solid black;
        }
    </style>
    
  

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Salary</th>
        </tr>

        <tr>
            <td>Ram</td>
            <td>98...</td>
            <td>KTM</td>
            <td>50k</td>
        </tr>

        <tr>
            <td>Sita</td>
            <td>98...</td>
            <td>Bhaktapur</td>
            <td>30k</td>
        </tr>

        <tr>
            <td>Hari</td>
            <td>98...</td>
            <td>Chitwan</td>
            <td>40k</td>
        </tr>
    </table>


    <br><br>



    <h3>Student Marks</h3>

    <table border="1" cellpadding="10">
        <tr>
            <th>Roll</th>
            <th>30</th>
            <th>22</th>
            <th>20</th>
        </tr>

        <tr>
            <th>Student Name</th>
            <td>Ram</td>
            <td>Sita</td>
            <td>Hari</td>
        </tr>

        <tr>
            <th>Marks</th>
            <td>40</td>
            <td>90</td>
            <td>50</td>
        </tr>
    </table>
    
</body>
</html>
